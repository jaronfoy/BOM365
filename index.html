<style>
:root{--bg:#f7f4ee;--card:#fff;--ink:#2f2924;--muted:#756b63;--accent:#6f4e37;--gold:#b58a4a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif;min-height:100vh}
.wrap{max-width:760px;margin:auto;padding:28px 18px 50px}.title{text-align:center;margin-bottom:22px}
h1{font-size:clamp(28px,6vw,44px);margin:0 0 8px}.subtitle{color:var(--muted);font-family:system-ui,sans-serif}
.card{background:var(--card);border-radius:22px;padding:22px;box-shadow:0 8px 30px #00000012;margin:16px 0}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-family:system-ui,sans-serif}
button,input{font:inherit;border:1px solid #ddd1c5;border-radius:12px;padding:12px;background:#fff;color:var(--ink)}
button{cursor:pointer;background:var(--accent);color:white;border:0;font-weight:700}
button.secondary{background:#eee7df;color:var(--ink)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block;margin-bottom:6px}
.wheel{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0}
.wheel button{width:48px;height:48px;border-radius:50%;padding:0;font-size:25px}
.wheel .num{font-family:system-ui,sans-serif;font-weight:800;font-size:22px;min-width:80px;text-align:center}
.result{text-align:center;padding:28px 12px}.day{font-family:system-ui,sans-serif;color:var(--gold);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.ref{font-size:clamp(30px,7vw,52px);margin:12px 0 8px;color:var(--accent)}
.theme{font-size:22px;line-height:1.4}.month{font-family:system-ui,sans-serif;color:var(--muted);margin-top:12px}
.nav{display:flex;gap:10px}.nav button{flex:1}
.note{font-family:system-ui,sans-serif;color:var(--muted);font-size:13px;text-align:center;margin-top:18px}
@media(max-width:520px){.controls{grid-template-columns:1fr}.ref{font-size:34px}.theme{font-size:19px}}
</style>
</head>

    <div class="subtitle">A chronological journey through significant teachings of Jesus Christ</div>
  </div>

  <div class="card">
    <div class="controls">
      <div>

        <input id="date" type="date">
      </div>
      <div>
        <span class="label">Jump to day</span>
        <input id="dayInput" type="number" min="1" max="365" value="1">
      </div>
    </div>
    <div class="wheel">
      <button class="secondary" id="down">−</button>
      <div class="num" id="wheelDay">Day 1</div>
      <button id="up">+</button>
    </div>
    <div class="nav">
      <button class="secondary" id="prev">Previous</button>
      <button id="today">Today</button>
      <button class="secondary" id="next">Next</button>
    </div>
  </div>

  <div class="card result">
    <div class="day" id="dayLabel">January 1 · Day 1</div>
    <div class="ref" id="ref">1 Nephi 1:1</div>
    <div class="theme" id="theme">Nephi's testimony</div>
    <div class="month" id="progress">1 of 365</div>
  </div>

  <div class="note">Use the wheel, date picker, or day number to explore the year.</div>
</div>

const dateEl=document.getElementById("date"), dayInput=document.getElementById("dayInput");
const wheelDay=document.getElementById("wheelDay"), dayLabel=document.getElementById("dayLabel"), ref=document.getElementById("ref"), theme=document.getElementById("theme"), progress=document.getElementById("progress");
const months=["January","February","March","April","May","June","July","August","September","October","November","December"];

function ordinalDay(d){return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(d.getFullYear(),0,1))/86400000)+1}

// show(n, yearOverride) - yearOverride lets callers render the ordinal day in a specific year.
// If yearOverride omitted, prefer the year from the date input (if set), otherwise current year.
function show(n, yearOverride){
  n=Math.max(1,Math.min(365,Math.floor(n))); 
  const year = yearOverride ?? (dateEl.value ? new Date(dateEl.value+"T00:00:00").getFullYear() : new Date().getFullYear());
  const d=new Date(year,0,n-1 + 1); // normalize: new Date(year,0,n) gives Jan + (n) days; using n-1+1 keeps clarity
  // but simpler: construct by adding (n-1) days to Jan 1
  const jan1 = new Date(year,0,1);
  const dayDate = new Date(jan1.getFullYear(), jan1.getMonth(), jan1.getDate() + (n-1));
  dayInput.value=n; wheelDay.textContent=`Day ${n}`;
  dayLabel.textContent=`${months[dayDate.getMonth()]} ${dayDate.getDate()} · Day ${n}`;
  ref.textContent=readings[n-1][0]; theme.textContent=readings[n-1][1]; progress.textContent=`${n} of 365`;
  dateEl.value=`${year}-${String(dayDate.getMonth()+1).padStart(2,"0")}-${String(dayDate.getDate()).padStart(2,"0")}`;
}

function fromDate(){
  const d=new Date(dateEl.value+"T00:00:00"); 
  if(!isNaN(d)) show(ordinalDay(d), d.getFullYear());
}

document.getElementById("up").onclick=()=>show(+dayInput.value+1);
document.getElementById("down").onclick=()=>show(+dayInput.value-1);
document.getElementById("next").onclick=()=>show(+dayInput.value+1);
document.getElementById("prev").onclick=()=>show(+dayInput.value-1);
dayInput.onchange=()=>show(+dayInput.value);
dateEl.onchange=fromDate;
document.getElementById("today").onclick=()=>{
  const now=new Date(); 
  const start=new Date(now.getFullYear(),0,1); 
  const n=Math.min(365,Math.max(1,Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate())-start)/86400000)+1));
  show(n, now.getFullYear());
};
